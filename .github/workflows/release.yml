name: Release

# Publishing a release on GitHub (with a tag such as v0.1.0) publishes AskTim! on PyPI.
# PyPI trusts this workflow (its "trusted publisher": comparativechrono/AskTim, release.yml,
# environment pypi), so no PyPI token is stored anywhere.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Build the package
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check that the release's tag matches the version in the code
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/asktim/_version.py').read()).group(1))")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The release's tag is $GITHUB_REF_NAME, but src/asktim/_version.py says $version. Make them the same (tag v$version)."
            exit 1
          fi
      - name: Build the wheels and the source archive, and check them
        run: |
          python -m pip install --upgrade build twine wheel
          python -m build
          # the wheels for Windows: the same, but the command AskTim! is AskTim!.cmd (Windows cannot run
          # a file without an extension); pip on Windows takes them before the wheel for any platform
          ASKTIM_WINDOWS_WHEEL=1 python -m build --wheel --outdir windows
          for platform in win_amd64 win32 win_arm64; do
            python -m wheel tags --platform-tag "$platform" windows/*-py3-none-any.whl
          done
          mv windows/*-win*.whl dist/
          ls dist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish on PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/AskTim/
    permissions:
      id-token: write  # lets PyPI check that this workflow is the trusted publisher
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
