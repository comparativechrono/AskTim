name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # the release workflow runs these tests before it publishes anything
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # Python 3.8 and 3.9 are not built for the newest Ubuntu
          - python: "3.8"
            os: ubuntu-22.04
          - python: "3.9"
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the programs the tests use (and xvfb, a screen in memory for the tests of the window)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bwa samtools bubblewrap zsh fish xvfb
          # let bubblewrap build the agent's sandbox (newer Ubuntu restricts unprivileged user namespaces)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install AskTim! and what the tests need
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" pandas
          # Snakemake (for the test of a whole workflow run) needs Python 3.11 or newer
          if python -c "import sys; sys.exit(sys.version_info < (3, 11))"; then python -m pip install snakemake; fi
      - name: Install marked and jsdom, for the check of the notebook's Markdown sanitiser
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/md" marked@15 jsdom@24
      - name: Run the tests
        env:
          ASKTIM_NODE_MODULES: ${{ runner.temp }}/md/node_modules
        run: python -m pytest -q

  macos:
    name: macOS, Python 3.13
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install AskTim! and what the tests need
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" pandas
      - name: Run the tests
        run: python -m pytest -q

  windows:
    # AskTim! on Windows: the wheel for Windows installs, and AskTim! (and asktim) run from cmd and PowerShell
    name: Windows, Python 3.13
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the wheel for Windows, as the release does, and install it
        shell: bash
        run: |
          python -m pip install --upgrade build wheel
          ASKTIM_WINDOWS_WHEEL=1 python -m build --wheel --outdir windows
          python -m wheel tags --remove --platform-tag win_amd64 windows/*-py3-none-any.whl
          python -m pip install windows/*.whl
      - name: AskTim! in cmd
        shell: cmd
        # (a batch file that runs another one - AskTim!.cmd - needs call, to carry on after it)
        run: |
          call AskTim! --version || exit /b 1
          asktim --version || exit /b 1
          call AskTim! status || exit /b 1
      - name: AskTim! in PowerShell, and the window's modules
        shell: pwsh
        run: |
          AskTim! --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          asktim status
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import tkinter, asktim.gui, asktim.gui.app, asktim.gui.backend; print('Tk', tkinter.TkVersion)"
      - name: The window on Windows (the head, its menu - Windows' own - and Quit)
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_window_gui.py -k "head or quit"
