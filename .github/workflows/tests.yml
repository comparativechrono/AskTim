name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # the release workflow runs these tests before it publishes anything
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # Python 3.8 and 3.9 are not built for the newest Ubuntu
          - python: "3.8"
            os: ubuntu-22.04
          - python: "3.9"
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the programs the tests use
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bwa samtools bubblewrap zsh fish
          # let bubblewrap build the agent's sandbox (newer Ubuntu restricts unprivileged user namespaces)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install AskTim! and what the tests need
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" pandas
      - name: Install marked and jsdom, for the check of the notebook's Markdown sanitiser
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/md" marked@15 jsdom@24
      - name: Run the tests
        env:
          ASKTIM_NODE_MODULES: ${{ runner.temp }}/md/node_modules
        run: python -m pytest -q

  macos:
    name: macOS, Python 3.13
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install AskTim! and what the tests need
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" pandas
      - name: Run the tests
        run: python -m pytest -q
